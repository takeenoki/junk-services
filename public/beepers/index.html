<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111715">
  <title>BEEPERS</title>
  <meta name="description" content="みんなで共有する10秒のループに、ひとつのBEEPを。">
  <link rel="icon" type="image/svg+xml" href="/beepers/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/beepers/favicon.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://junk-services.r32952507.workers.dev/beepers/">
  <meta property="og:title" content="BEEPERS">
  <meta property="og:description" content="みんなで共有する10秒のループに、ひとつのBEEPを。">
  <meta property="og:site_name" content="BEEPERS">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:image" content="https://junk-services.r32952507.workers.dev/beepers/ogp.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:alt" content="BEEPERSのタイトルと、電子音が並ぶ10秒の共有トラック。">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./script.js"></script>
</head>
<body>
  <main>
    <header><h1>BEEPERS<span>●</span></h1></header>
    <section aria-label="共有トラック" class="track-panel">
      <div class="track-heading"><span id="connection">接続中…</span><span><b id="count">0</b> / 100 SOUNDS</span></div>
      <div class="ruler" aria-hidden="true"><span>0</span><span>2</span><span>4</span><span>6</span><span>8</span><span>10s</span></div>
      <div id="timeline" role="img" aria-label="配置された音の開始位置と長さ">
        <div id="sounds"></div><div id="playhead"></div><p id="empty">最初のBEEPを、このループに。</p>
      </div>
      <div class="track-footer"><span>LOOP <b id="position">0.00</b>s</span><span>新しい音は、次のループから。</span></div>
    </section>
    <section class="controls" aria-label="音色">
      <p class="tab-instructions">サンプルタグで音を聴き、音を残すタブで音を追加します。</p>
      <div class="tabs" role="tablist" aria-label="音色の操作">
        <button id="sample-tab" type="button" role="tab" aria-selected="true" aria-controls="sample-panel">サンプル</button>
        <button id="post-tab" type="button" role="tab" aria-selected="false" aria-controls="post-panel" tabindex="-1">音を残す</button>
      </div>
      <div id="sample-panel" role="tabpanel" aria-labelledby="sample-tab">
        <p class="hint">ボタンを押すと音を試聴できます。共有トラックには追加されません。</p>
        <div id="sample-buttons" class="tone-buttons"></div>
      </div>
      <div id="post-panel" role="tabpanel" aria-labelledby="post-tab" hidden>
      <div class="controls-heading"><p id="availability" role="status">接続を待っています。</p></div>
      <p class="hint">ボタンを押すと共有トラックに音を追加できます。<br>
        ボタンを押す長さで音の長さが決まります。（0.05〜3秒）<br>
        <span id="post-hint">1時間に一度音を追加できます。</span></p>
      <div id="buttons" class="tone-buttons"></div>
      </div>
      <p id="message" role="status" aria-live="polite"></p>
    </section>
    <footer>新しい音が加わるたび、前の音は少し小さく。<br>100音を超えると、いちばん古い音が消えます。</footer>
    <button id="clear" type="button" hidden>クリア</button>
  </main>
  <button id="overlay" type="button"><span class="overlay-brand">BEEPERS</span><span>クリック（タップ）すると音が鳴り始めます。</span><span class="overlay-note">10秒のループに参加する ↗</span></button>
</body>
</html>
