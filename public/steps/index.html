  <body>
    <main>
      <a class="home" href="/">Junk Services</a>
      <header>
        <p class="eyebrow">DAILY STEPS</p>
        <h1>武えのきの歩数</h1>
      </header>
      <form id="month-form">
        <label for="month">表示する月</label>
        <input id="month" type="month" min="0001-01" max="9999-12" required>

      <section aria-labelledby="month-heading" aria-busy="true" id="results">
        <h2 id="month-heading">月別の歩数</h2>
        <p id="status" role="status" aria-live="polite">読み込み中…</p>
        <div class="table-wrap">
          <table hidden id="steps-table">
            <caption>日別の歩数（未記録の日は「—」）</caption>
            <thead><tr><th scope="col">日付</th><th scope="col">歩数</th></tr></thead>
            <tbody id="days"></tbody>
          </table>
        </div>
      </section>
